<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英语小探险</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --green:#58cc02;--green-d:#46a302;--green-bg:#d7ffb8;
  --red:#ff4b4b;--red-d:#d33131;--red-bg:#ffdfe0;
  --blue:#1cb0f6;--blue-d:#1899d6;--blue-bg:#ddf4ff;
  --orange:#ff9600;--orange-d:#e08400;--orange-bg:#fff1dc;
  --purple:#a560e8;--purple-d:#8a45cc;
  --yellow:#ffc800;--bg:#f7f7f7;--card:#fff;--line:#e5e5e5;--text:#3c3c3c;--muted:#8a8a8a;--off:#dddddd;
  --tipbg:#fff4d6;--tipink:#7a5a00;--sheet-tip:rgba(255,255,255,.7);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green-bg:#1f3a12;--red-bg:#3d1d1e;--blue-bg:#13324a;--orange-bg:#3a2a12;
    --green-d:#79e02a;--red-d:#ff7a7a;--blue-d:#5cc8ff;--orange-d:#ffb14a;--purple-d:#c08cff;
    --bg:#131f24;--card:#1c2b32;--line:#33444c;--text:#e8eef1;--muted:#94a6ae;--off:#3c4c54;
    --tipbg:#3a3214;--tipink:#ffe08a;--sheet-tip:rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --green-bg:#1f3a12;--red-bg:#3d1d1e;--blue-bg:#13324a;--orange-bg:#3a2a12;
  --green-d:#79e02a;--red-d:#ff7a7a;--blue-d:#5cc8ff;--orange-d:#ffb14a;--purple-d:#c08cff;
  --bg:#131f24;--card:#1c2b32;--line:#33444c;--text:#e8eef1;--muted:#94a6ae;--off:#3c4c54;
  --tipbg:#3a3214;--tipink:#ffe08a;--sheet-tip:rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-block:calc(14px + env(safe-area-inset-top,0px)) 150px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.en{font-family:"Fredoka","Arial Rounded MT Bold","Avenir Next","Segoe UI",Arial,sans-serif;letter-spacing:.3px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:14px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 10px;white-space:nowrap}
.chip.fire{color:var(--orange)} .chip.xp{color:#e3a400} .chip.goal{color:var(--blue-d)}
.title{text-align:center;font-size:34px;margin:20px 0 2px;font-weight:700}
.sub{text-align:center;color:var(--muted);margin:0 0 16px}

/* tasks */
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 14px 12px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.phead h2{font-size:20px;margin:0}
.pbar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 10px}
.pbar>i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line)}
.task:first-of-type{border-top:none}
.task .ti{font-size:30px;width:40px;text-align:center;flex:none}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block;font-size:16px}
.task .tt span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.task.done .tt b{color:var(--green-d)}
.tbtn{flex:none;border:none;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;color:#fff;background:var(--blue);border-bottom:4px solid var(--blue-d)}
.tbtn.off{background:var(--orange);border-bottom-color:var(--orange-d)}
.tbtn:active{transform:translateY(2px);border-bottom-width:2px}
.tok{flex:none;font-size:26px}
.prow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ghost{flex:1;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:8px 10px;font-weight:800;font-size:14px;color:var(--blue-d);white-space:nowrap}
.ghost:active{transform:translateY(2px);border-bottom-width:2px}
.checkin{margin-top:12px;width:100%}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}

.sec{font-size:18px;font-weight:800;margin:22px 2px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;
  padding:12px 8px 10px;text-align:center;transition:transform .08s}
.cat:active{transform:translateY(3px);border-bottom-width:2px}
.cat .emoji{font-size:32px}
.cat .cname{font-size:17px;font-weight:800;margin-top:2px}
.cat .cdesc{font-size:12px;color:var(--muted);margin-top:2px;min-height:16px}
.stars{color:var(--yellow);font-size:17px;margin-top:2px;letter-spacing:2px}
.stars .off{color:var(--off)}
.mini{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 10px 0}
.mini>i{display:block;height:100%;background:var(--blue)}

.big{border:none;border-radius:16px;padding:14px 12px;font-size:18px;font-weight:800;color:#fff;
  border-bottom:5px solid rgba(0,0,0,.18);transition:transform .08s}
.big:active{transform:translateY(3px);border-bottom-width:2px}
.big.green{background:var(--green)} .big.red{background:var(--red)} .big.blue{background:var(--blue)}
.big.orange{background:var(--orange)} .big.purple{background:var(--purple)} .big.gray{background:#bdbdbd}
.big[disabled]{opacity:.7;cursor:default}
.row1{display:grid;gap:12px;margin-top:12px}

details.set{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:18px}
details.set summary{font-weight:800;cursor:pointer}
.speedrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.spd{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700}
.spd.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
.mutetip{background:var(--tipbg);border:2px solid var(--yellow);border-radius:14px;padding:10px 12px;margin-top:14px;font-size:14px;line-height:1.5;color:var(--tipink)}
.mutetip.small{font-size:13px;padding:7px 10px;margin-top:12px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px;line-height:1.6}

/* lesson */
.lhead{display:flex;align-items:center;gap:12px}
.xbtn{background:none;border:none;font-size:26px;color:#aaa;padding:0 4px}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.combo{min-width:62px;text-align:right;font-weight:800;color:var(--orange);font-size:15px}
.qlabel{font-size:20px;font-weight:800;margin:24px 0 8px}
.prompt{text-align:center;margin:8px 0 20px}
.pic{font-size:96px;line-height:1.15}
.wordbig{font-size:56px;font-weight:700;color:var(--blue-d);margin:16px 0 6px;word-break:break-word}
.letterbig{font-size:110px;font-weight:700;color:var(--blue-d);line-height:1.1}
.zhbig{font-size:44px;font-weight:700;margin:16px 0 6px}
.minispk{margin-top:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:6px 16px;font-size:16px;font-weight:700;color:var(--blue-d)}
.speaker{width:120px;height:120px;border-radius:30px;border:none;background:var(--blue);color:#fff;font-size:56px;
  border-bottom:6px solid var(--blue-d);margin:14px auto 8px;display:block}
.speaker:active{transform:translateY(3px);border-bottom-width:3px}
.hint{color:var(--muted);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;
  padding:14px 6px;font-size:26px;font-weight:700;position:relative;min-height:80px;word-break:break-word}
.opt.zh{font-size:24px}
.opt.lt{font-size:44px}
.opt.long{font-size:19px}
.opt .em{font-size:46px;line-height:1.1;display:block}
.opt .emw{font-size:15px;font-weight:600;color:var(--muted);display:block;margin-top:2px}
.opt .k{position:absolute;left:10px;top:8px;font-size:12px;color:#bbb;font-family:sans-serif;font-weight:700;border:2px solid var(--line);border-radius:6px;padding:0 5px}
.opt:active{transform:translateY(3px);border-bottom-width:2px}
.opt.ok{background:var(--green-bg);border-color:var(--green);color:var(--green-d)}
.opt.bad{background:var(--red-bg);border-color:var(--red);color:var(--red-d);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.blank{display:inline-block;min-width:.8em;border-bottom:5px solid var(--orange);color:var(--orange)}

/* flashcard */
.fcard{background:var(--card);border:2px solid var(--line);border-bottom-width:6px;border-radius:24px;padding:24px 16px;text-align:center;margin-top:22px}
.fcard .pic{font-size:110px}
.fcard .wordbig{margin:10px 0 0}
.fcard .zh{font-size:22px;color:var(--muted);margin-top:4px}
.fcard .ex{font-size:17px;color:var(--muted);margin-top:14px}
.fbtns{display:flex;gap:12px;margin-top:20px}
.fbtns .big{flex:1}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;padding-top:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;animation:up .2s ease-out}
.sheet.ok{background:var(--green-bg)} .sheet.bad{background:var(--red-bg)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-in{max-width:560px;margin:0 auto}
.fb-title{font-size:22px;font-weight:800}
.sheet.ok .fb-title{color:var(--green-d)} .sheet.bad .fb-title{color:var(--red-d)}
.fb-detail{font-size:20px;margin:6px 0}
.fb-detail .en{font-size:26px;font-weight:700}
.tip{background:var(--sheet-tip);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.55;margin:6px 0}
.sheet-btns{display:flex;gap:10px;margin-top:10px}
.sheet-btns .big{flex:1}
.iconbtn{border:none;border-radius:16px;background:var(--card);font-size:24px;width:62px;border-bottom:5px solid rgba(0,0,0,.12)}

/* result / checkin */
.result{text-align:center;padding-top:26px}
.result .emo{font-size:88px}
.result h2{font-size:28px;margin:8px 0}
.bigstars{font-size:50px;color:var(--yellow);letter-spacing:6px}
.bigstars .off{color:var(--off)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 4px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.rbtns{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.taskdone{background:var(--orange-bg);border:2px solid var(--orange);border-radius:14px;padding:10px;font-weight:800;color:var(--orange-d);margin-top:10px}

.ccard{background:linear-gradient(160deg,#ffd84d,#ff9600);color:#3b2400;border-radius:26px;padding:22px 18px;text-align:center;margin-top:20px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.ccard .d{font-weight:800;font-size:15px;opacity:.8}
.ccard .n{font-size:60px;font-weight:700;line-height:1.1;margin-top:6px}
.ccard .n small{font-size:22px}
.ccard .m{font-size:17px;font-weight:700;margin-top:4px}
.ccard .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ccard .row div{background:rgba(255,255,255,.45);border-radius:14px;padding:8px 2px;font-size:12px;font-weight:700}
.ccard .row b{display:block;font-size:22px}
.ccard .done{margin-top:12px;font-size:14px;text-align:left;background:rgba(255,255,255,.35);border-radius:14px;padding:8px 12px;line-height:1.7}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.calhead b{font-size:20px}
.calnav{border:2px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:40px;font-size:18px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.cal .day{aspect-ratio:1;border-radius:12px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;position:relative}
.cal .day.on{background:var(--green-bg);border-color:var(--green);color:var(--green-d)}
.cal .day.on::after{content:"✓";font-size:16px;line-height:1}
.cal .day.part{border-color:var(--orange);border-style:dashed}
.cal .day.today{box-shadow:0 0 0 3px var(--blue)}
.cal .day.empty{background:none;border:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.badge{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-size:13px;font-weight:700}
.badge .bi{font-size:34px;display:block}
.badge.lock{opacity:.4;filter:grayscale(1)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}

/* homework & teacher */
.hwban{background:var(--blue-bg);border:2px solid var(--blue);border-radius:14px;padding:8px 12px;font-weight:800;color:var(--blue-d);font-size:14px;margin-bottom:6px}
.hwban .hwnote{font-weight:600;color:var(--text);margin-top:4px;line-height:1.5}
.hwinfo{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
.inp,select.inp,textarea.inp{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
textarea.inp{width:100%;min-height:84px;resize:vertical;font-size:14px}
.form label{display:block;font-weight:800;font-size:14px;margin-top:12px}
.form label .inp{display:block;width:100%;margin-top:4px;font-weight:400}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec2{font-weight:800;font-size:14px;margin:16px 0 6px}
.tpls{display:flex;gap:8px;flex-wrap:wrap}
.trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:2px dashed var(--line)}
.trow .inp{font-size:15px;padding:6px 8px}
.trow .grow{flex:1;min-width:140px}
.del{border:none;background:none;font-size:20px;color:var(--red);padding:4px 6px;margin-left:auto}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px;font-weight:800;font-size:15px}
.tabs button.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
.out{margin-top:12px}
.rcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.rcard .rn{font-size:18px;font-weight:800}
.rcard .rs{font-size:13px;color:var(--muted)}
.rcard .rg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
.rcard .rg div{background:var(--bg);border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted)}
.rcard .rg b{display:block;font-size:17px;color:var(--text)}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px;font-size:15px}
.warn{color:var(--red-d);font-weight:700;font-size:13px;margin-top:6px}
.prev{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:12px;line-height:1.7;font-size:15px}
.confetti{position:fixed;top:-40px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= 词库 =================
   每条：[英文, 中文, 图片]  —— 全部是 KET 入门 / 小学低年级的高频词 */
const CATS = {
  letters:{name:'字母 ABC',emoji:'🔤',desc:'Aa Bb Cc … Zz',types:['case','lcase','listenL','abc','first'],
    tip:'b 和 d 是镜子里的双胞胎：b 肚子朝右，d 肚子朝左。p 和 q 也一样。',
    items:[['A','apple','🍎'],['B','ball','⚽'],['C','cat','🐱'],['D','dog','🐶'],['E','egg','🥚'],['F','fish','🐟'],
      ['G','grape','🍇'],['H','hat','🎩'],['I','ice cream','🍦'],['J','juice','🧃'],['K','kite','🪁'],['L','lion','🦁'],
      ['M','monkey','🐵'],['N','nose','👃'],['O','orange','🍊'],['P','pig','🐷'],['Q','queen','👸'],['R','rabbit','🐰'],
      ['S','sun','☀️'],['T','tiger','🐯'],['U','umbrella','☂️'],['V','violin','🎻'],['W','watch','⌚'],['X','box','📦'],
      ['Y','yo-yo','🪀'],['Z','zebra','🦓']]},
  hello:{name:'打招呼',emoji:'👋',desc:'Hello! Thank you!',types:['z2w','w2z','listenT'],
    tip:'见面说 Hello / Hi，分开说 Goodbye / Bye。别人帮你，就说 Thank you!',
    items:[['Hello!','你好！','🙋'],['Goodbye!','再见！','👋'],['Thank you!','谢谢你！','🙏'],['Sorry.','对不起。','😔'],
      ['Good morning!','早上好！','🌅'],['Good night!','晚安！','🌙'],['Yes.','是的。','👍'],['No.','不是。','🙅'],
      ['Please.','请。','🤲'],['I love you.','我爱你。','❤️'],['How are you?','你好吗？','🙂'],['I\'m fine.','我很好。','😄'],
      ['Nice to meet you.','很高兴认识你。','🤝'],['What\'s your name?','你叫什么名字？','📛']]},
  numbers:{name:'数字',emoji:'🔢',desc:'one two three',types:['p2w','w2p','listen','z2w','spell'],
    tip:'one two three four five，six seven eight nine ten —— 数手指一起念！',
    items:[['one','一','1️⃣'],['two','二','2️⃣'],['three','三','3️⃣'],['four','四','4️⃣'],['five','五','5️⃣'],
      ['six','六','6️⃣'],['seven','七','7️⃣'],['eight','八','8️⃣'],['nine','九','9️⃣'],['ten','十','🔟']]},
  colors:{name:'颜色',emoji:'🎨',desc:'red blue green',types:['p2w','w2p','listen','z2w','spell'],
    tip:'问颜色：What colour is it? 回答：It\'s red.',
    items:[['red','红色','🟥'],['blue','蓝色','🟦'],['green','绿色','🟩'],['yellow','黄色','🟨'],['orange','橙色','🟧'],
      ['purple','紫色','🟪'],['black','黑色','⬛'],['white','白色','⬜'],['brown','棕色','🟫'],['pink','粉色','🩷']]},
  animals:{name:'动物',emoji:'🐼',desc:'cat dog panda',types:['p2w','w2p','listen','listen','z2w','spell'],
    tip:'说一只动物前面加 a：a cat，a dog；元音开头用 an：an elephant。',

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seededShuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const todayStr=()=>ymd(new Date());
const dayBefore=s=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d-1));};
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n));};
const diffDays=(a,b)=>{const u=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((u(b)-u(a))/864e5);};

function makeTask(kind,extra={}){return Object.assign({id:kind+'-'+Math.random().toString(36).slice(2,7),kind,done:false},extra);}
function generateTasks(keepDone){
  const t=todayStr();
  if(tasks.date!==t){tasks={date:t,regen:0,list:[]};keepDone=false;}
  else if(keepDone) tasks.regen++;
  delete tasks.hw;
  const r=rng(hash(t+'#'+tasks.regen));
  const L=LEVELS[level];
  const list=keepDone?tasks.list.filter(x=>x.done):[];
  const has=(k,c)=>list.some(x=>x.kind===k&&(c===undefined||x.cat===c));
  const cand=[];
  // 1. 学新词：按顺序找还没学完的类别，前两个里随机挑
  const open=ORDER.filter(c=>c!=='letters'&&learnedIn(c)<ITEMS[c].length);
  const newCat=open.length?open[Math.floor(r()*Math.min(2,open.length))]:null;
  if(newCat&&!has('new')) cand.push({p:100,t:makeTask('new',{cat:newCat,n:Math.min(L.newN,ITEMS[newCat].length-learnedIn(newCat))})});
  // 2. 字母：还没拿满 3 星就每天练
  if(((prog.letters||{}).stars||0)<3&&!has('cat','letters')) cand.push({p:90,t:makeTask('cat',{cat:'letters'})});
  // 3. 错题
  if(mistakeKeys().length&&!has('review')) cand.push({p:80,t:makeTask('review')});
  // 4. 复习一个已经学过的类别
  const learnedCats=ORDER.filter(c=>c!=='letters'&&c!==newCat&&learnedIn(c)>=3);
  if(learnedCats.length&&!has('cat')){const c=learnedCats[Math.floor(r()*learnedCats.length)];cand.push({p:60+r()*20,t:makeTask('cat',{cat:c})});}
  // 5. 听力
  if(!has('listen')) cand.push({p:50+r()*20,t:makeTask('listen')});
  // 6. 线下小任务
  if(!has('offline')){const o=OFFLINE[Math.floor(r()*OFFLINE.length)];cand.push({p:L.n>=4?75:40,t:makeTask('offline',{e:o.e,t:o.t,s:o.s})});}
  // 7. 混合挑战（兜底）
  if(!has('mix')) cand.push({p:30,t:makeTask('mix')});
  if(((prog.letters||{}).stars||0)>=3&&!has('cat','letters')) cand.push({p:20,t:makeTask('cat',{cat:'letters'})});
  cand.sort((a,b)=>b.p-a.p);
  for(const c of cand){if(list.length>=L.n)break;list.push(c.t);}
  tasks.list=list; saveTasks();
}

function keepPlaybackSession(){

    const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
    v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    silentEl=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));

function beep(f,t0,d,type='sine',vol=.15){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+d);}
function sfx(k){if(!actx)return;const n=actx.currentTime;
  if(k==='ok'){beep(660,n,.12);beep(990,n+.1,.2);}else if(k==='bad'){beep(200,n,.28,'square',.06);}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>beep(f,n+i*.12,.25));}
  else if(k==='flip'){beep(880,n,.08,'triangle',.08);}}

function pickDistract(it,n,pool,ok){
  const res=[];const src=shuffle(pool.filter(o=>o.key!==it.key&&ok(o)));
  for(const o of src){if(res.length>=n)break;res.push(o);}return res;
}
function wordOK(it,o){return o.w.toLowerCase()!==it.w.toLowerCase()&&o.e!==it.e&&o.z!==it.z;}
function letterChoices(L,n,upper){
  const set=[L];const g=CONFUSE.find(s=>s.includes(L));
  if(g) shuffle(g.split('')).forEach(c=>{if(set.length<n&&!set.includes(c))set.push(c);});
  const abc=upper?'ABCDEFGHIJKLMNOPQRSTUVWXYZ':'abcdefghijklmnopqrstuvwxyz';
  shuffle(abc.split('')).forEach(c=>{if(set.length<n&&!set.includes(c))set.push(c);});
  return shuffle(set);
}
function makeQ(it,retry=false,forceType){
  let types=CATS[it.cat].types.filter(t=>voiceOK||!t.startsWith('listen'));
  if(forceType&&(voiceOK||!forceType.startsWith('listen'))) types=[forceType];
  let type=types[Math.floor(Math.random()*types.length)];
  if(type==='spell'&&(!/^[a-z]{3,8}$/.test(it.w))) type='p2w';
  if(type==='first'&&it.w==='X') type='case';
  if(type==='abc'&&it.w==='A') type='lcase';
  const pool=ITEMS[it.cat];
  const q={it,type,retry};
  if(it.cat==='letters'){
    const U=it.w,l=U.toLowerCase();
    if(type==='case'){q.opts=letterChoices(l,4,false).map(v=>({v,h:v}));q.ans=l;q.cls='lt en';}
    else if(type==='lcase'){q.opts=letterChoices(U,4,true).map(v=>({v,h:v}));q.ans=U;q.cls='lt en';}
    else if(type==='listenL'){q.opts=letterChoices(U,4,true).map(v=>({v,h:v+v.toLowerCase()}));q.ans=U;q.cls='lt en';}
    else if(type==='abc'){const prev=String.fromCharCode(U.charCodeAt(0)-1);q.prev=prev;q.opts=letterChoices(U,5,true).filter(v=>v!==prev);
      q.opts=[U,...q.opts.filter(v=>v!==U)].slice(0,4);q.opts=shuffle(q.opts).map(v=>({v,h:v}));q.ans=U;q.cls='lt en';}
    else if(type==='first'){q.opts=letterChoices(U,4,true).map(v=>({v,h:v+v.toLowerCase()}));q.ans=U;q.cls='lt en';}
    return q;
  }
  if(type==='spell'){
    const w=it.w,idx=Math.floor(Math.random()*w.length);q.idx=idx;q.ans=w[idx];
    q.opts=letterChoices(w[idx],4,false).map(v=>({v,h:v}));q.cls='lt en';return q;
  }
  const others=pickDistract(it,3,pool,o=>wordOK(it,o));
  const four=shuffle([it,...others]);
  q.ans=it.key;
  if(type==='p2w'||type==='z2w'||type==='listenT'){q.opts=four.map(o=>({v:o.key,h:esc(o.w)}));q.cls='en'+(four.some(o=>o.w.length>9)?' long':'');}
  else if(type==='w2z'){q.opts=four.map(o=>({v:o.key,h:esc(o.z)}));q.cls='zh';}
  else {q.opts=four.map(o=>({v:o.key,h:`<span class="em">${o.e}</span>${hintMode&&type==='w2p'?`<span class="emw">${esc(o.z)}</span>`:''}`}));q.cls='';}
  return q;
}

  const mute=IS_IOS&&!HAS_CLIPS?`<div class="mutetip small">${MUTE_TIP}</div>`:'';

    case 'p2w': return `<div class="qlabel">这是什么？选出英文单词</div><div class="prompt"><div class="pic">${it.e}</div>${hintMode?`<div class="hint">${esc(it.z)}</div>`:''}</div>`;
    case 'w2p': return `<div class="qlabel">读一读，选出对的图</div><div class="prompt"><div class="wordbig en">${esc(it.w)}</div>${spk}</div>`;
    case 'listen': return `<div class="qlabel">听一听，选出你听到的</div><div class="prompt"><button class="speaker" id="spk" aria-label="再听一遍">🔊</button><div class="hint">点喇叭可以再听一遍</div>${mute}</div>`;
    case 'listenT': return `<div class="qlabel">听一听，选出你听到的句子</div><div class="prompt"><button class="speaker" id="spk" aria-label="再听一遍">🔊</button><div class="hint">点喇叭可以再听一遍</div>${mute}</div>`;
    case 'z2w': return `<div class="qlabel">用英语怎么说？</div><div class="prompt">${it.e?`<div class="pic" style="font-size:64px">${it.e}</div>`:''}<div class="zhbig">${esc(it.z)}</div></div>`;
    case 'w2z': return `<div class="qlabel">这句英语是什么意思？</div><div class="prompt"><div class="wordbig en" style="font-size:42px">${esc(it.w)}</div>${spk}</div>`;
    case 'spell': {const w=it.w;return `<div class="qlabel">缺了哪个字母？</div><div class="prompt"><div class="pic" style="font-size:72px">${it.e}</div>
      <div class="wordbig en" style="letter-spacing:6px">${esc(w.slice(0,q.idx))}<span class="blank">_</span>${esc(w.slice(q.idx+1))}</div>${hintMode?`<div class="hint">${esc(it.z)}</div>`:''}${spk}</div>`;}
    case 'case': return `<div class="qlabel">大写 ${it.w} 的小写是？</div><div class="prompt"><div class="letterbig en">${it.w}</div>${spk}</div>`;
    case 'lcase': return `<div class="qlabel">小写 ${it.w.toLowerCase()} 的大写是？</div><div class="prompt"><div class="letterbig en">${it.w.toLowerCase()}</div>${spk}</div>`;
    case 'listenL': return `<div class="qlabel">听一听，是哪个字母？</div><div class="prompt"><button class="speaker" id="spk" aria-label="再听一遍">🔊</button><div class="hint">点喇叭可以再听一遍</div>${mute}</div>`;
    case 'abc': return `<div class="qlabel">${q.prev} 后面是哪个字母？</div><div class="prompt"><div class="letterbig en" style="font-size:80px">${q.prev} <span class="blank">?</span></div></div>`;
    case 'first': return `<div class="qlabel">这个单词是哪个字母开头的？</div><div class="prompt"><div class="pic">${it.e}</div><div class="wordbig en" style="font-size:40px"><span class="blank">_</span>${esc(it.z.slice(1))}</div>${spk}</div>`;
  }
}
/* 每种题出题时读什么（提示模式才自动读；听力题总是读） */
function promptSpeech(q){
  const it=q.it;
  if(q.type==='listenL') return sayLetter(it.w);
  if(q.type==='listen'||q.type==='listenT') return [it.w,it.w];
  if(q.type==='first') return it.z;
  if(q.type==='case'||q.type==='lcase') return sayLetter(it.w);
  if(q.type==='p2w'||q.type==='z2w'||q.type==='abc'||q.type==='spell') return null; // 读出来就等于告诉答案
  return it.w;
}

let L=null;
function startTask(id){
  const x=tasks.list.find(t=>t.id===id);if(!x)return;
  if(x.kind==='new') return startLearn(x.cat,x.n,id);
  if(x.kind==='cat') return startLesson(x.cat,id);
  return startLesson(x.kind,id);
}
function learnedPool(){const p=WORDS.filter(i=>learned[i.key]);return p.length>=4?p:WORDS;}
function startLesson(mode,taskId){
  unlockAudio();loadVoices();
  let pool,force;
  if(mode==='review') pool=mistakeKeys().map(k=>byKey[k]).filter(Boolean).slice(0,LESSON_LEN);
  if(mode==='review'&&!pool.length) pool=shuffle(learnedPool().slice()).slice(0,LESSON_LEN); // 没有错题就做混合练习
  else if(mode==='mix') pool=shuffle(learnedPool().slice()).slice(0,LESSON_LEN);
  else if(mode==='listen'){pool=shuffle(learnedPool().slice()).slice(0,LESSON_LEN);force='listen';}
  else {
    // 类别闯关：先练学过的，不够再补没学过的（看图题就能边做边学）
    const items=ITEMS[mode];const a=shuffle(items.filter(i=>learned[i.key])),b=shuffle(items.filter(i=>!learned[i.key]));
    pool=a.concat(b).slice(0,LESSON_LEN);
  }
  if(!pool.length) return home();
  L={mode,taskId,force,queue:pool.map(it=>makeQ(it,false,force)),done:0,firstTotal:pool.length,firstCorrect:0,combo:0,maxCombo:0,gained:0};
  next();
}

function startLearn(cat,n,taskId){

  const spk=document.getElementById('spk');if(spk){spk.onclick=()=>speak([it.w,it.w]);}
  speak([it.w,it.w]);
  const p=document.getElementById('prev');if(p)p.onclick=()=>{L.li--;flash();};
  document.getElementById('nextc').onclick=()=>{unlockAudio();sfx('flip');markLearned(it);
    if(L.li<n-1){L.li++;flash();}
    else{ // 每个新词出两道不同题
      const tps=CATS[L.mode].types;
      const qs=[];L.learn.forEach(w=>{qs.push(makeQ(w,false,'w2p'));qs.push(makeQ(w,false,tps.includes('listen')?'listen':'z2w'));});
      L.queue=shuffle(qs);L.firstTotal=qs.length;L.qStart=true;next();}
  };
}
function next(){
  if(!L.queue.length) return finish();
  stopSpeech();clearSheets();
  L.q=L.queue.shift();L.answered=false;screen='lesson';
  const q=L.q,it=q.it,total=L.done+L.queue.length+1;
  const off=L.learn?50:0,span=L.learn?50:100;
  app.innerHTML=`<div class="lhead"><button class="xbtn" id="quit" aria-label="退出">✕</button>
      <div class="bar"><i style="width:${off+L.done/total*span}%"></i></div>
      <div class="combo">${L.combo>=2?`🔥×${L.combo}`:''}</div></div>
    ${q.retry?'<div class="hint" style="margin-top:14px">🔁 再试一次刚才错的题</div>':''}
    ${promptHTML(q)}
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${q.cls}" data-v="${esc(o.v)}"><span class="k">${i+1}</span>${o.h}</button>`).join('')}</div>`;
  document.getElementById('quit').onclick=askQuit;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
  const sp=promptSpeech(q), spk=document.getElementById('spk');

}
function askQuit(){
  clearSheets();
  const sh=document.createElement('div');sh.className='sheet bad';
  sh.innerHTML=`<div class="sheet-in"><div class="fb-title">要退出吗？</div>

  document.getElementById('leave').onclick=()=>{sh.remove();home();};
}
const PRAISE=['Great!','Well done!','Super!','Excellent!','Good job!','Perfect!'];
function answer(btn){
  unlockAudio();
  if(L.answered)return;L.answered=true;
  const q=L.q,it=q.it,ok=btn.dataset.v===q.ans;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.ans)b.classList.add('ok');});
  if(!ok)btn.classList.add('bad');
  if(ok){L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo);L.done++;L.gained+=10;if(!q.retry)L.firstCorrect++;
    if(L.mode==='review')bumpMistake(it,-1);
    if(it.cat!=='letters')markLearned(it);
    sfx('ok');}
  else{L.combo=0;bumpMistake(it,+1);L.queue.push(makeQ(it,true,L.force));sfx('bad');}
  const praise=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  speak(ok?[...[].concat(sayItem(it)).slice(0,1),praise]:sayItem(it));
  const detail=it.cat==='letters'
    ?`${it.e} <span class="en">${it.w}${it.w.toLowerCase()}</span>　<span class="en" style="font-size:20px">${it.w} is for ${esc(it.z)}</span>`
    :`${it.e} <span class="en">${esc(it.w)}</span>　${esc(it.z)}`;
  const sheet=document.createElement('div');sheet.className='sheet '+(ok?'ok':'bad');
  sheet.innerHTML=`<div class="sheet-in">
    <div class="fb-title">${ok?'✅ <span class="en">'+praise+'</span>'+(L.combo>=3?` 连对 ${L.combo} 题！`:''):'❌ 正确答案是：'}</div>
    <div class="fb-detail">${detail}</div>
    ${ok?'':`<div class="tip">💡 ${esc(CATS[it.cat].tip)}</div>`}
    <div class="sheet-btns">${voiceOK?'<button class="iconbtn" id="again" aria-label="再听一遍">🔊</button>':''}
    <button class="big ${ok?'green':'red'}" id="cont">继续</button></div></div>`;
  document.body.appendChild(sheet);
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>speak(sayItem(it));
  document.getElementById('cont').onclick=()=>{sheet.remove();next();};
}
function finish(){
  stopSpeech();clearSheets();screen='result';
  const acc=L.firstTotal?L.firstCorrect/L.firstTotal:1, stars=acc>=.9?3:acc>=.7?2:1;
  const bonus=acc===1?20:5;L.gained+=bonus;xp+=L.gained;store.set('xp',xp);
  if(CATS[L.mode]&&!L.learn){const p=prog[L.mode]||{stars:0,plays:0};p.stars=Math.max(p.stars,stars);p.plays++;prog[L.mode]=p;store.set('prog',prog);}
  const td=curToday();td.lessons++;td.xp+=L.gained;store.set('today',td);
  const task=L.taskId?finishTask(L.taskId,{acc:Math.round(acc*100),stars}):null;
  const left=tasks.list.filter(t=>!t.done).length;
  const emo=stars===3?'🏆':stars===2?'🎉':'💪';
  const msg=stars===3?'全对，太厉害了！':stars===2?'很棒，再接再厉！':'坚持练习，下次更好！';
  app.innerHTML=`<div class="result"><div class="emo">${emo}</div><h2>${msg}</h2>${starsHTML(stars,'bigstars')}
    ${task?`<div class="taskdone">📋 完成任务：${esc(taskInfo(task).t)}<br>${left?`今天还剩 ${left} 个任务`:'🎯 今天的任务全部完成，快去打卡！'}</div>`:''}
    <div class="stats"><div class="stat"><b style="color:#e3a400">+${L.gained}</b><span>经验</span></div>
      <div class="stat"><b style="color:var(--green-d)">${Math.round(acc*100)}%</b><span>一次答对</span></div>
      <div class="stat"><b style="color:var(--orange)">${L.maxCombo}</b><span>最多连对</span></div></div>
    <div class="rbtns">${task&&!left&&!checkins[todayStr()]?'<button class="big orange" id="ci">✅ 去打卡</button>':''}
      ${L.learn?'':'<button class="big green" id="again">再玩一关</button>'}
      <button class="big blue" id="back">返回首页</button></div></div>`;
  const mode=L.mode;
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>startLesson(mode==='review'&&!mistakeKeys().length?'mix':mode);
  document.getElementById('back').onclick=home;
  const ci=document.getElementById('ci');if(ci)ci.onclick=doCheckin;
  sfx('win');if(stars===3||(task&&!left))confetti();
}
function confetti(){
  const e=['⭐','🎉','✨','🌟','🎈'];
  for(let i=0;i<32;i++){const s=document.createElement('div');s.className='confetti';s.textContent=e[i%e.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.8+Math.random()*1.8)+'s';s.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),4500);}
}

const KINDS={new:'学新单词',cat:'主题闯关',listen:'听力挑战',review:'错题复习',mix:'混合挑战',offline:'线下任务（自己写）'};
const TEMPLATES=[
  {name:'🔤 字母起步',tasks:[{kind:'cat',cat:'letters'},{kind:'new',cat:'hello',n:3},{kind:'offline',t:'唱一遍 ABC 字母歌',s:'边唱边指字母'}]},
  {name:'📚 学新词',tasks:[{kind:'new',cat:'animals',n:4},{kind:'cat',cat:'animals'},{kind:'listen'}]},
  {name:'🔁 复习巩固',tasks:[{kind:'review'},{kind:'mix'},{kind:'listen'}]},
  {name:'🌈 综合',tasks:[{kind:'new',cat:'colors',n:3},{kind:'cat',cat:'letters'},{kind:'listen'},{kind:'offline',t:'用英语说出 5 种颜色',s:'指着身边的东西说'}]}
];
const clip=(v,n)=>String(v==null?'':v).replace(/[\u0000-\u001f]/g,' ').trim().slice(0,n);
const SALT='ea-v1';
function sign(o){const c=Object.assign({},o);delete c.sig;delete c.tampered;return hash(JSON.stringify(c)+SALT).toString(36);}
function encodeCode(prefix,o){return prefix+btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function decodeAny(text){
  text=String(text||'').trim(); if(!text) throw new Error('内容是空的');
  const m=text.match(/EA-(?:HW|RP):\s*([A-Za-z0-9+/=]+)/);
  try{
    if(m) return JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    const j=text.indexOf('{'); if(j<0) throw 0; return JSON.parse(text.slice(j));
  }catch(e){throw new Error('看不懂这段内容，请确认复制完整');}
}
function cleanHw(o){
  if(!o||o.type!=='hw'||!Array.isArray(o.tasks)) throw new Error('这不是作业（可能是学习报告？）');
  const tasks=o.tasks.slice(0,6).map(x=>{
    if(!x||!KINDS[x.kind]) return null; const t={kind:x.kind};
    if(x.kind==='new'||x.kind==='cat'){if(!CATS[x.cat]||(x.kind==='new'&&x.cat==='letters'))return null;t.cat=x.cat;}
    if(x.kind==='new') t.n=Math.max(1,Math.min(8,Math.round(+x.n)||4));
    if(x.kind==='offline'){t.t=clip(x.t,40);if(!t.t)return null;t.s=clip(x.s,40);t.e='📝';}
    return t;}).filter(Boolean);
  if(!tasks.length) throw new Error('作业里没有任务');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(o.start||'')) throw new Error('开始日期不对');
  const hw={type:'hw',v:1,title:clip(o.title,30)||'英语作业',teacher:clip(o.teacher,20),note:clip(o.note,200),
    start:o.start,days:Math.max(1,Math.min(60,Math.round(+o.days)||7)),tasks};
  hw.id=clip(o.id,40).replace(/[^\w-]/g,'')||('hw'+hash(JSON.stringify(hw)).toString(36));
  return hw;
}
function cleanReport(o){
  if(!o||o.type!=='report'||!o.hw||!Array.isArray(o.days)) throw new Error('这不是学习报告（可能是作业？）');
  const r={type:'report',v:1,name:clip(o.name,20)||'未署名',
    hw:{id:clip(o.hw.id,40),title:clip(o.hw.title,30),start:/^\d{4}-\d{2}-\d{2}$/.test(o.hw.start||'')?o.hw.start:todayStr(),days:Math.max(1,Math.min(60,+o.hw.days||7))},
    gen:+o.gen||0,words:+o.words||0,streak:+o.streak||0,xp:+o.xp||0,
    days:o.days.slice(0,60).map(d=>({d:clip(d.d,10),done:+d.done||0,total:+d.total||0,ci:!!d.ci,acc:d.acc==null?null:+d.acc})),
    mis:(Array.isArray(o.mis)?o.mis:[]).slice(0,8).map(x=>[clip(x[0],30),+x[1]||0])};
  r.tampered=sign(o)!==o.sig;
  return r;
}
let dlApi=null;
(async()=>{try{if(window.claude&&typeof claude.use==='function')dlApi=await claude.use('downloads');}catch(e){}})();
async function saveFile(name,obj){

async function copyFrom(ta){

}

function buildReport(){
  const t=todayStr(),hw=homework;
  const start=hw?hw.start:addDays(t,-6), n=hw?hw.days:7;
  const days=[];
  for(let i=0;i<n;i++){const d=addDays(start,i);if(d>t)break;
    const h=hist[d], lst=h&&(!hw||h.hw===hw.id)?h.list:[];
    const accs=lst.filter(x=>x.done&&x.acc!=null).map(x=>x.acc);
    days.push({d,done:lst.filter(x=>x.done).length,total:hw?hw.tasks.length:lst.length,ci:!!checkins[d],
      acc:accs.length?Math.round(accs.reduce((a,b)=>a+b,0)/accs.length):null});}
  const r={type:'report',v:1,name:kidName,
    hw:hw?{id:hw.id,title:hw.title,start:hw.start,days:hw.days}:{id:'self',title:'自主练习（最近 7 天）',start,days:7},
    gen:Date.now(),days,words:Object.keys(learned).length,streak:streakOf(),xp,
    mis:mistakeKeys().slice(0,8).map(k=>[byKey[k]?byKey[k].w:k,mistakes[k]])};
  r.sig=sign(r);return r;
}
function reportStats(r){
  const full=r.days.filter(d=>d.total&&d.done>=d.total).length, ci=r.days.filter(d=>d.ci).length;
  const accs=r.days.filter(d=>d.acc!=null).map(d=>d.acc);
  return {full,ci,acc:accs.length?Math.round(accs.reduce((a,b)=>a+b,0)/accs.length):null};
}
function dotsHTML(r){
  const map={};r.days.forEach(d=>map[d.d]=d);let h='';
  for(let i=0;i<r.hw.days;i++){const d=addDays(r.hw.start,i),x=map[d];
    const s=!x?'▫️':x.ci||(x.total&&x.done>=x.total)?'✅':x.done?'🟡':'⬜';
    h+=`<span title="${fmtMD(d)}">${s}</span>`;}
  return `<div class="dots">${h}</div>`;
}

    document.getElementById('msg').textContent=await saveFile(`report-${(rr.name.replace(/[^A-Za-z0-9]/g,'')||'student')}-${todayStr()}.json`,rr);};
  document.getElementById('cd').onclick=()=>{const rr=getR();if(!rr)return;const st=reportStats(rr);
    const text=`【英语小探险·学习报告】${rr.name} · ${rr.hw.title}\n完成 ${st.full}/${rr.days.length} 天，打卡 ${st.ci} 天\n老师在「老师工具 → 查看报告」里粘贴这整段：\n${encodeCode('EA-RP:',rr)}`;
    document.getElementById('msg').textContent='';document.getElementById('out').innerHTML=codeBox(text,'报告码');wireCode();};
}

/* ---------- 老师端 ---------- */
function newDraft(){return {title:'本周英语作业',teacher:'',note:'',start:todayStr(),days:7,tasks:TEMPLATES[1].tasks.map(x=>Object.assign({},x))};}
function catOpts(sel,noLetters){return ORDER.filter(c=>!(noLetters&&c==='letters')).map(c=>`<option value="${c}" ${c===sel?'selected':''}>${CATS[c].emoji} ${CATS[c].name}</option>`).join('');}
function teacher(tab){
  stopSpeech();clearSheets();screen='teacher';
  if(!draft)draft=newDraft();
  app.innerHTML=`${subHeader('👩‍🏫 老师工具')}
    <div class="tabs"><button class="${tab==='make'?'on':''}" data-tab="make">📝 布置作业</button><button class="${tab==='see'?'on':''}" data-tab="see">📊 查看报告</button></div>
    <div id="tb"></div>`;
  document.getElementById('back').onclick=home;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>teacher(b.dataset.tab));
  tab==='make'?makeTab():seeTab();
}
function makeTab(){
  const tb=document.getElementById('tb'),d=draft;
  tb.innerHTML=`<div class="panel form">
      <label>作业名称<input class="inp" id="f_title" maxlength="30" value="${esc(d.title)}"></label>
      <label>老师署名<input class="inp" id="f_teacher" maxlength="20" value="${esc(d.teacher)}" placeholder="例如 Miss Wang"></label>
      <div class="frow"><label>开始日期<input class="inp" type="date" id="f_start" value="${esc(d.start)}"></label>
        <label>持续<select class="inp" id="f_days">${[3,5,7,10,14,21,28].map(n=>`<option value="${n}" ${n===d.days?'selected':''}>${n} 天</option>`).join('')}</select></label></div>
      <div class="sec2">快速套用模板</div>
      <div class="tpls">${TEMPLATES.map((t,i)=>`<button class="spd" data-tpl="${i}">${t.name}</button>`).join('')}</div>
      <div class="sec2">每天的任务（每天都一样，最多 6 个；“学新单词”每天会自动换下一批）</div>
      ${d.tasks.map((x,i)=>`<div class="trow">
        <select class="inp" data-k="${i}">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${k===x.kind?'selected':''}>${v}</option>`).join('')}</select>
        ${x.kind==='new'||x.kind==='cat'?`<select class="inp" data-c="${i}">${catOpts(x.cat,x.kind==='new')}</select>`:''}
        ${x.kind==='new'?`<select class="inp" data-n="${i}">${[2,3,4,5,6].map(n=>`<option ${n===x.n?'selected':''}>${n}</option>`).join('')}</select><span class="hint">个</span>`:''}
        ${x.kind==='offline'?`<input class="inp grow" data-t="${i}" maxlength="40" value="${esc(x.t||'')}" placeholder="例如：读课本第 12 页">`:''}
        <button class="del" data-rm="${i}" aria-label="删除这个任务">✕</button></div>`).join('')}
      ${d.tasks.length<6?'<div class="prow"><button class="ghost" id="add">＋ 加一个任务</button></div>':''}
      <label>给孩子的话（会显示在任务上方）<textarea class="inp" id="f_note" maxlength="200" placeholder="例如：这周学动物，每天都要大声跟读哦！">${esc(d.note)}</textarea></label>
    </div>
    <div class="row1"><button class="big green" id="f_dl">📄 下载作业文件</button><button class="big blue" id="f_code">💬 生成作业码（发微信）</button></div>
    <p class="note" id="f_msg"></p><div id="f_out"></div>`;
  const save=()=>store.set('draft',draft);
  const val=id=>document.getElementById(id).value;
  ['f_title','f_teacher','f_start','f_days','f_note'].forEach(id=>document.getElementById(id).oninput=()=>{
    d.title=val('f_title');d.teacher=val('f_teacher');d.start=val('f_start')||todayStr();d.days=+val('f_days');d.note=val('f_note');save();});
  tb.querySelectorAll('[data-k]').forEach(s=>s.onchange=()=>{const i=+s.dataset.k,k=s.value;
    d.tasks[i]=k==='new'?{kind:k,cat:'animals',n:4}:k==='cat'?{kind:k,cat:'letters'}:k==='offline'?{kind:k,t:''}:{kind:k};save();makeTab();});
  tb.querySelectorAll('[data-c]').forEach(s=>s.onchange=()=>{d.tasks[+s.dataset.c].cat=s.value;save();});
  tb.querySelectorAll('[data-n]').forEach(s=>s.onchange=()=>{d.tasks[+s.dataset.n].n=+s.value;save();});
  tb.querySelectorAll('[data-t]').forEach(s=>s.oninput=()=>{d.tasks[+s.dataset.t].t=s.value;save();});
  tb.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{d.tasks.splice(+b.dataset.rm,1);save();makeTab();});
  tb.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{d.tasks=TEMPLATES[+b.dataset.tpl].tasks.map(x=>Object.assign({},x));save();makeTab();});
  const add=document.getElementById('add');if(add)add.onclick=()=>{d.tasks.push({kind:'listen'});save();makeTab();};
  const build=()=>{const msg=document.getElementById('f_msg');
    try{const hw=cleanHw(Object.assign({type:'hw',id:'hw'+Date.now().toString(36)},d));
      if(hw.tasks.length<d.tasks.length){msg.textContent='有线下任务还没写内容';return null;}
      msg.textContent='';return hw;}
    catch(e){msg.textContent='❌ '+e.message;return null;}};
  document.getElementById('f_dl').onclick=async()=>{const hw=build();if(!hw)return;
    document.getElementById('f_msg').textContent=await saveFile(`homework-${hw.start}.json`,hw);
    document.getElementById('f_out').innerHTML=hwPreview(hw);};
  document.getElementById('f_code').onclick=()=>{const hw=build();if(!hw)return;
    const text=`【英语小探险·老师作业】${hw.title}\n${fmtMD(hw.start)} 起 ${hw.days} 天，每天 ${hw.tasks.length} 个任务\n打开英语小探险 →「导入老师作业」，粘贴这整段文字：\n${encodeCode('EA-HW:',hw)}`;
    document.getElementById('f_out').innerHTML=codeBox(text,'作业码')+hwPreview(hw);wireCode();};
}
function seeTab(){
  const tb=document.getElementById('tb');
  const list=Object.entries(reports).sort((a,b)=>(b[1].hw.start+b[1].hw.title).localeCompare(a[1].hw.start+a[1].hw.title)||a[1].name.localeCompare(b[1].name));
  tb.innerHTML=`<p class="hint" style="margin-top:10px">家长发来的报告文件或报告码（EA-RP: 开头）都可以导入，同一个孩子同一份作业会自动换成最新的。报告只存在这台设备上。</p>
    <div class="row1"><button class="big blue" id="rf">📂 选择报告文件（可多选）</button></div>
    <div class="sec2">或者粘贴报告码（可以一次粘贴好几段）</div>
    <textarea class="inp" id="rp" placeholder="【英语小探险·学习报告】…&#10;EA-RP:……"></textarea>
    <div class="row1"><button class="big green" id="rgo">导入</button></div>
    <p class="note" id="rmsg"></p>
    <div class="sec2">已收到 ${list.length} 份报告</div>
    ${list.length?list.map(([k,r])=>reportCard(r,k)).join(''):'<p class="hint">还没有报告</p>'}
    ${list.length?'<div class="row1" style="margin-top:16px"><button class="big gray" id="rclr">清空全部报告</button></div>':''}`;
  const addTexts=texts=>{let ok=0,bad=[];
    texts.forEach(txt=>{
      const parts=String(txt).match(/EA-RP:\s*[A-Za-z0-9+/=]+/g)||[txt];
      parts.forEach(p=>{try{const r=cleanReport(decodeAny(p));const k=r.name+'|'+r.hw.id;
        if(!reports[k]||reports[k].gen<=r.gen)reports[k]=r;ok++;}catch(e){bad.push(e.message);}});});
    store.set('reports',reports);seeTab();
    document.getElementById('rmsg').textContent=(ok?`✅ 导入了 ${ok} 份报告`:'')+(bad.length?`　❌ ${bad.length} 份没导入：${bad[0]}`:'');};
  document.getElementById('rf').onclick=()=>pickFile(true,addTexts);
  document.getElementById('rgo').onclick=()=>addTexts([document.getElementById('rp').value]);
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{delete reports[b.dataset.del];store.set('reports',reports);seeTab();});
  const clr=document.getElementById('rclr');if(clr)clr.onclick=()=>{if(confirm('确定清空全部报告吗？')){reports={};store.set('reports',reports);seeTab();}};
}

document.addEventListener('keydown',e=>{
  if(screen!=='lesson')return;
  const c=document.getElementById('cont');
  if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click();return;}
  if(/^[1-4]$/.test(e.key)){const b=app.querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click();}
});
/* 过了午夜回到首页时，自动换成新一天的任务 */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&screen==='home'&&tasks.date!==todayStr())home();});

if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
home();
</script>
